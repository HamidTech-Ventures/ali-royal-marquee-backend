version: '3.8'

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "5020:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=aliroyal;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
      - AdminPassword=SuperSecretAdminPassword123!
      - Jwt__Key=SuperSecureRandomGeneratedKey2026!
      - Jwt__Issuer=AliRoyalMarquee
      - Jwt__Audience=AliRoyalMarqueeUsers
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://frontend
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aliroyal
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
